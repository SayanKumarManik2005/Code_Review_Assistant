spring.application.name=code-review-api

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/YOUR_DATABASE_NAME
spring.datasource.username=postgres
# REPLACE WITH YOUR ACTUAL DB PASSWORD
spring.datasource.password=YOUR_ACTUAL_DATABASE_PASSWORD
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Google Gemini API Config
# REPLACE WITH YOUR ACTUAL API KEY
gemini.api.key=YOUR_GOOGLE_GEMINI_API_KEY
# The URL must be a single line ending with '?key=' so your Java code can append the key
gemini.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=
